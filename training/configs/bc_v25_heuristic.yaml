seed: 2026
cuda:
  allow_tf32: true
  matmul_precision: high
  cudnn_benchmark: true
  empty_cache_on_start: true
  memory_fraction: 0.95
  num_threads: 4
env:
  controlled_player: 0
  max_steps_per_game: 300
  obs_include_action_mask: false
  opponent_agent: pool
  allow_chow: true
opponent_pool:
  per_seat_sample: true
  cache_model_agents: true
  members:
    - kind: heuristic
      weight: 0.75
    - kind: win_first
      weight: 0.10
    - kind: model
      name: v1_1000w_cuda
      weight: 0.05
      model_path: artifacts/checkpoints/ppo_v1_committed_scratch/periodic/model_10000000_steps.zip
      device: cuda
      deterministic: false
    - kind: model
      name: v2_1500w_cuda
      weight: 0.10
      model_path: artifacts/checkpoints/ppo_v2_committed_scratch/periodic/model_15000000_steps.zip
      device: cuda
      deterministic: false
model:
  policy: MlpPolicy
  device: cuda
  activation_fn: gelu
  ortho_init: false
  feature_extractor:
    name: layer_norm_mlp
    hidden_dims: [1024, 1024, 512]
    features_dim: 768
    dropout: 0.02
  net_arch:
    pi: [1024, 512, 256]
    vf: [1024, 512, 256]
train:
  n_steps: 2048
  batch_size: 2048
  learning_rate: 0.0001
behavior_cloning:
  dataset_path: artifacts/datasets/v25_heuristic_bc_100w.npz
  num_samples: 1000000
  max_games: 200000
  progress_interval: 10000
  batch_size: 4096
  epochs: 6
  learning_rate: 0.0001
  weight_decay: 0.00001
  entropy_coef: 0.001
  max_grad_norm: 1.0
logging:
  checkpoint_dir: artifacts/checkpoints/v25_bc_heuristic
