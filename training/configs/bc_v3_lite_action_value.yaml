seed: 2026
cuda:
  allow_tf32: true
  matmul_precision: high
  cudnn_benchmark: true
  empty_cache_on_start: true
  memory_fraction: 0.95
  num_threads: 8
env:
  controlled_player: 0
  max_steps_per_game: 300
  obs_include_action_mask: false
  obs_include_action_features: true
  opponent_agent: pool
  allow_chow: true
observation:
  version: obs_v3_lite_action_value
  include_action_features: true
action_features:
  effective_tiles: false
opponent_pool:
  per_seat_sample: true
  members:
    - kind: heuristic
      weight: 0.70
    - kind: win_first
      weight: 0.15
    - kind: random
      weight: 0.15
model:
  policy: MlpPolicy
  device: cuda
  activation_fn: gelu
  ortho_init: false
  feature_extractor:
    name: layer_norm_mlp
    hidden_dims: [2048, 1536, 1024]
    features_dim: 1024
    dropout: 0.03
  net_arch:
    pi: [1024, 512, 256]
    vf: [1024, 512, 256]
train:
  n_steps: 2048
  batch_size: 4096
  learning_rate: 0.00008
behavior_cloning:
  dataset_path: artifacts/datasets/v3_lite_action_value_heuristic_20w.npz
  num_samples: 200000
  max_games: 200000
  progress_interval: 10000
  batch_size: 4096
  epochs: 8
  learning_rate: 0.00008
  weight_decay: 0.00001
  entropy_coef: 0.001
  max_grad_norm: 1.0
logging:
  checkpoint_dir: artifacts/checkpoints/v3_lite_action_value_bc
