seed: 2026
env:
  controlled_player: 0
  max_steps_per_game: 300
  obs_include_action_mask: false
  opponent_agent: heuristic
  allow_chow: true
reward:
  score_scale: 10.0
  step_penalty: 0.001
  discard_live_xiaoji_penalty: 0.04
  discard_dead_xiaoji_penalty: 0.005
  concealed_kong_bonus: 0.004
  exposed_kong_penalty: 0.01
  added_kong_penalty: 0.006
model:
  policy: MlpPolicy
  device: cuda
  activation_fn: tanh
  net_arch:
    pi: [128, 128]
    vf: [128, 128]
train:
  total_timesteps: 256
  learning_rate: 0.0003
  n_steps: 64
  batch_size: 32
  n_epochs: 1
  gamma: 0.99
  gae_lambda: 0.95
  ent_coef: 0.01
logging:
  checkpoint_dir: artifacts/checkpoints/earlystop_smoke
  checkpoint_freq: 128
early_stop:
  enabled: true
  eval_freq: 128
  num_games: 2
  opponent: heuristic
  metric: avg_score
  mode: max
  min_delta: 1000.0
  patience: 1
  min_timesteps: 128
  seed_offset: 200000
