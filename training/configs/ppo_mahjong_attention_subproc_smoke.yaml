seed: 2026
cuda:
  allow_tf32: true
  matmul_precision: high
  cudnn_benchmark: true
  empty_cache_on_start: true
  memory_fraction: 0.8
  num_threads: 4
observation:
  include_table: true
  include_hand: true
env:
  controlled_player: 0
  max_steps_per_game: 120
  opponent_agent: heuristic
  allow_chow: true
reward:
  score_scale: 6.0
  step_penalty: 0.003
  terminal_win_bonus: 0.03
  claim_use_wildcard_penalty: 0.03
model:
  policy: MultiInputPolicy
  device: cuda
  activation_fn: gelu
  ortho_init: false
  feature_extractor:
    name: mahjong_attention
    static_hidden_dims: [256, 256]
    d_model: 64
    nhead: 4
    num_layers: 2
    features_dim: 256
    dropout: 0.05
    max_hand_tiles: 14
  net_arch:
    pi: [256, 128]
    vf: [256, 128]
train:
  total_timesteps: 4000
  num_envs: 8
  vec_env_type: subproc
  learning_rate: 0.0003
  n_steps: 256
  batch_size: 512
  n_epochs: 4
  gamma: 0.99
  gae_lambda: 0.95
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  clip_range: 0.2
logging:
  checkpoint_dir: artifacts/checkpoints/ppo_mahjong_attention_subproc_smoke
  checkpoint_freq: 500000
