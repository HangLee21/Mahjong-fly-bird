seed: 2026
cuda:
  allow_tf32: true
  matmul_precision: high
  cudnn_benchmark: true
  empty_cache_on_start: true
  memory_fraction: 0.8
  num_threads: 8
observation:
  include_table: true
  include_hand: true
env:
  controlled_player: 0
  max_steps_per_game: 300
  opponent_agent: heuristic
  allow_chow: true
reward:
  score_scale: 6.0
  step_penalty: 0.001
  discard_live_xiaoji_penalty: 0.045
  discard_dead_xiaoji_penalty: 0.0
  human_discard_preference_bonus: 0.002
  isolated_honor_discard_bonus: 0.010
  discard_connected_suit_over_honor_penalty: 0.012
  discard_pair_over_honor_penalty: 0.010
  discard_pair_penalty: 0.004
  discard_only_pair_penalty: 0.008
  discard_best_shanten_bonus: 0.002
  discard_miss_best_shanten_penalty: 0.012
  discard_break_meld_penalty: 0.014
  discard_break_taatsu_penalty: 0.008
  discard_break_good_taatsu_penalty: 0.018
  discard_near_ready_good_taatsu_penalty: 0.028
  discard_weak_taatsu_bonus: 0.006
  discard_ready_regression_penalty: 0.040
  discard_one_shanten_regression_penalty: 0.024
  discard_shape_score_bonus: 0.0012
  claim_improvement_bonus: 0.018
  claim_same_penalty: 0.010
  claim_regression_penalty: 0.040
  pass_non_improving_claim_bonus: 0.006
  pass_same_claim_bonus: 0.004
  pass_improving_claim_penalty: 0.018
  discard_over_kong_penalty: 0.002
  discard_over_kong_ready_penalty: 0.004
  concealed_kong_bonus: 0.004
  exposed_kong_penalty: 0.010
  added_kong_penalty: 0.006
  added_kong_as_concealed: true
  added_kong_as_concealed_bonus: 0.004
  added_kong_ready_bonus: 0.003
  shanten_improvement_bonus: 0.010
  shanten_regression_penalty: 0.018
  ready_bonus: 0.018
  hand_goal_mode: committed
  hand_goal_improvement_bonus: 0.0008
  hand_goal_regression_penalty: 0.0012
  hand_goal_switch_penalty: 0.004
  terminal_win_bonus: 0.016
  self_draw_bonus: 0.014
  ron_bonus: 0.005
  fan_bonus: 0.0018
  point_bonus: 0.007
  win_fan_scale: 0.1
model:
  policy: MultiInputPolicy
  device: cuda
  activation_fn: gelu
  ortho_init: false
  feature_extractor:
    name: mahjong_attention
    static_hidden_dims: [512, 512]
    d_model: 128
    nhead: 4
    num_layers: 2
    features_dim: 512
    dropout: 0.05
    max_hand_tiles: 14
  net_arch:
    pi: [512, 256, 128]
    vf: [512, 256, 128]
train:
  total_timesteps: 1000000
  num_envs: 1
  vec_env_type: dummy
  learning_rate: 0.0001
  n_steps: 256
  batch_size: 256
  n_epochs: 4
  gamma: 0.99
  gae_lambda: 0.95
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  clip_range: 0.15
logging:
  checkpoint_dir: artifacts/checkpoints/ppo_mahjong_attention_v2
  checkpoint_freq: 100000
