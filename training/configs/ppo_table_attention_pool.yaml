seed: 2026
cuda:
  allow_tf32: true
  matmul_precision: high
  cudnn_benchmark: true
  empty_cache_on_start: true
  memory_fraction: 0.8
  num_threads: 8
observation:
  include_table: true
env:
  controlled_player: 0
  max_steps_per_game: 300
  opponent_agent: pool
  allow_chow: true
opponent_pool:
  per_seat_sample: true
  members:
    - kind: heuristic
      weight: 0.4
    - kind: win_first
      weight: 0.3
    - kind: random
      weight: 0.3
reward:
  score_scale: 6.0
  step_penalty: 0.001
  discard_live_xiaoji_penalty: 0.03
  human_discard_preference_bonus: 0.002
  discard_danger_penalty: 0.012
  concealed_kong_bonus: 0.004
  exposed_kong_penalty: 0.008
  added_kong_penalty: 0.005
  added_kong_as_concealed: true
  added_kong_as_concealed_bonus: 0.004
  added_kong_ready_bonus: 0.003
  shanten_improvement_bonus: 0.012
  shanten_regression_penalty: 0.006
  ready_bonus: 0.025
  hand_goal_mode: committed
  hand_goal_improvement_bonus: 0.002
  hand_goal_regression_penalty: 0.001
  hand_goal_switch_penalty: 0.004
  terminal_win_bonus: 0.025
  self_draw_bonus: 0.015
  ron_bonus: 0.008
  fan_bonus: 0.006
  point_bonus: 0.002
model:
  policy: MultiInputPolicy
  device: cuda
  activation_fn: gelu
  ortho_init: false
  feature_extractor:
    name: table_attention_transformer
    static_hidden_dims: [512, 512]
    d_model: 128
    nhead: 4
    num_layers: 2
    features_dim: 512
    dropout: 0.05
    max_history_len: 128
  net_arch:
    pi: [512, 256, 128]
    vf: [512, 256, 128]
train:
  total_timesteps: 30000
  num_envs: 1
  vec_env_type: dummy
  learning_rate: 0.0001
  n_steps: 256
  batch_size: 256
  n_epochs: 4
  gamma: 0.99
  gae_lambda: 0.95
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  clip_range: 0.15
logging:
  checkpoint_dir: artifacts/checkpoints/ppo_table_attention
  checkpoint_freq: 15000
