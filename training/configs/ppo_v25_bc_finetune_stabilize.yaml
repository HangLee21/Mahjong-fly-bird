seed: 2026
cuda:
  allow_tf32: true
  matmul_precision: high
  cudnn_benchmark: true
  empty_cache_on_start: true
  memory_fraction: 0.95
  num_threads: 4
env:
  controlled_player: 0
  max_steps_per_game: 300
  obs_include_action_mask: false
  opponent_agent: pool
  allow_chow: true
opponent_pool:
  per_seat_sample: true
  cache_model_agents: true
  members:
    - kind: heuristic
      weight: 0.85
    - kind: win_first
      weight: 0.10
    - kind: model
      name: v2_1500w_cuda
      weight: 0.05
      model_path: artifacts/checkpoints/ppo_v2_committed_scratch/periodic/model_15000000_steps.zip
      device: cuda
      deterministic: false
reward:
  score_scale: 8.0
  step_penalty: 0.0008
  discard_live_xiaoji_penalty: 0.035
  discard_dead_xiaoji_penalty: 0.0
  human_discard_preference_bonus: 0.001
  isolated_honor_discard_bonus: 0.003
  discard_connected_suit_over_honor_penalty: 0.003
  discard_pair_over_honor_penalty: 0.004
  discard_pair_penalty: 0.002
  discard_only_pair_penalty: 0.004
  discard_best_shanten_bonus: 0.001
  discard_miss_best_shanten_penalty: 0.004
  discard_break_meld_penalty: 0.004
  discard_break_taatsu_penalty: 0.002
  discard_break_good_taatsu_penalty: 0.003
  discard_shape_score_bonus: 0.0005
  discard_over_kong_penalty: 0.001
  discard_over_kong_ready_penalty: 0.002
  concealed_kong_bonus: 0.003
  exposed_kong_penalty: 0.008
  added_kong_penalty: 0.004
  added_kong_as_concealed: true
  added_kong_as_concealed_bonus: 0.003
  added_kong_ready_bonus: 0.002
  shanten_improvement_bonus: 0.004
  shanten_regression_penalty: 0.004
  ready_bonus: 0.008
  hand_goal_mode: committed
  hand_goal_improvement_bonus: 0.0003
  hand_goal_regression_penalty: 0.0005
  hand_goal_switch_penalty: 0.002
  terminal_win_bonus: 0.010
  self_draw_bonus: 0.010
  ron_bonus: 0.003
  fan_bonus: 0.001
  point_bonus: 0.004
model:
  policy: MlpPolicy
  device: cuda
  activation_fn: gelu
  ortho_init: false
  feature_extractor:
    name: layer_norm_mlp
    hidden_dims: [1024, 1024, 512]
    features_dim: 768
    dropout: 0.02
  net_arch:
    pi: [1024, 512, 256]
    vf: [1024, 512, 256]
train:
  total_timesteps: 4000000
  num_envs: 4
  vec_env_type: subproc
  learning_rate: 0.000005
  n_steps: 8192
  batch_size: 4096
  n_epochs: 2
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.04
  target_kl: 0.010
  ent_coef: 0.004
  vf_coef: 1.0
  max_grad_norm: 0.5
logging:
  checkpoint_dir: artifacts/checkpoints/ppo_v25_bc_finetune_stabilize
  checkpoint_freq: 1000000
early_stop:
  enabled: true
  eval_freq: 1000000
  num_games: 5000
  opponent: heuristic
  metric: avg_score
  mode: max
  min_delta: 0.01
  patience: 4
  min_timesteps: 1000000
  seed_offset: 100000
