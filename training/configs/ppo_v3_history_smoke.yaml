seed: 2026
observation:
  version: obs_v3_history
  history_len: 32
env:
  controlled_player: 0
  max_steps_per_game: 120
  opponent_agent: pool
  allow_chow: true
opponent_pool:
  members:
    - kind: heuristic
      weight: 0.7
    - kind: random
      weight: 0.3
reward:
  score_scale: 10.0
  step_penalty: 0.001
  human_discard_preference_bonus: 0.003
  shanten_improvement_bonus: 0.012
  shanten_regression_penalty: 0.006
  hand_goal_mode: committed
  hand_goal_improvement_bonus: 0.002
  hand_goal_regression_penalty: 0.001
model:
  policy: MultiInputPolicy
  device: auto
  activation_fn: gelu
  feature_extractor:
    name: hybrid_history_transformer
    static_hidden_dims: [64]
    d_model: 32
    nhead: 4
    num_layers: 1
    features_dim: 64
    dropout: 0.0
    max_history_len: 32
  net_arch:
    pi: [64]
    vf: [64]
train:
  total_timesteps: 128
  num_envs: 1
  vec_env_type: dummy
  learning_rate: 0.0003
  n_steps: 64
  batch_size: 64
  n_epochs: 1
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
logging:
  checkpoint_dir: artifacts/checkpoints/ppo_v3_history_smoke
  checkpoint_freq: 0
early_stop:
  enabled: false
