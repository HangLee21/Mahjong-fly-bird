seed: 2026
cuda:
  allow_tf32: true
  matmul_precision: high
  cudnn_benchmark: true
  empty_cache_on_start: true
  memory_fraction: 0.95
  num_threads: 6
observation:
  version: obs_v3_history
  history_len: 128
env:
  controlled_player: 0
  max_steps_per_game: 300
  obs_include_action_mask: false
  opponent_agent: pool
  allow_chow: true
opponent_pool:
  per_seat_sample: true
  cache_model_agents: true
  members:
    - kind: heuristic
      weight: 0.65
    - kind: win_first
      weight: 0.10
    - kind: random
      weight: 0.05
    - kind: model
      name: v1_1000w_cuda
      weight: 0.10
      model_path: artifacts/checkpoints/ppo_v1_committed_scratch/periodic/model_10000000_steps.zip
      device: cuda
      deterministic: false
    - kind: model
      name: v2_1500w_cuda
      weight: 0.10
      model_path: artifacts/checkpoints/ppo_v2_committed_scratch/periodic/model_15000000_steps.zip
      device: cuda
      deterministic: false
reward:
  score_scale: 6.0
  step_penalty: 0.001
  discard_live_xiaoji_penalty: 0.045
  discard_dead_xiaoji_penalty: 0.0
  human_discard_preference_bonus: 0.002
  isolated_honor_discard_bonus: 0.010
  discard_connected_suit_over_honor_penalty: 0.012
  discard_pair_over_honor_penalty: 0.010
  discard_pair_penalty: 0.004
  discard_only_pair_penalty: 0.008
  discard_best_shanten_bonus: 0.002
  discard_miss_best_shanten_penalty: 0.012
  discard_break_meld_penalty: 0.014
  discard_break_taatsu_penalty: 0.006
  discard_break_good_taatsu_penalty: 0.010
  discard_shape_score_bonus: 0.0012
  discard_over_kong_penalty: 0.002
  discard_over_kong_ready_penalty: 0.004
  concealed_kong_bonus: 0.004
  exposed_kong_penalty: 0.010
  added_kong_penalty: 0.006
  added_kong_as_concealed: true
  added_kong_as_concealed_bonus: 0.004
  added_kong_ready_bonus: 0.003
  shanten_improvement_bonus: 0.008
  shanten_regression_penalty: 0.014
  ready_bonus: 0.014
  hand_goal_mode: committed
  hand_goal_improvement_bonus: 0.0008
  hand_goal_regression_penalty: 0.0012
  hand_goal_switch_penalty: 0.004
  terminal_win_bonus: 0.014
  self_draw_bonus: 0.014
  ron_bonus: 0.005
  fan_bonus: 0.0018
  point_bonus: 0.007
model:
  policy: MultiInputPolicy
  device: cuda
  activation_fn: gelu
  ortho_init: false
  feature_extractor:
    name: hybrid_history_transformer_v2
    static_hidden_dims: [768, 512]
    d_model: 192
    nhead: 6
    num_layers: 3
    features_dim: 896
    dropout: 0.04
    max_history_len: 128
  net_arch:
    pi: [896, 448, 256]
    vf: [896, 448, 256]
train:
  total_timesteps: 20000000
  num_envs: 6
  vec_env_type: subproc
  learning_rate: 0.00003
  n_steps: 4096
  batch_size: 4096
  n_epochs: 3
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.08
  target_kl: 0.020
  ent_coef: 0.012
  vf_coef: 0.8
  max_grad_norm: 0.5
logging:
  checkpoint_dir: artifacts/checkpoints/ppo_v3_history_transformer_night
  checkpoint_freq: 1000000
early_stop:
  enabled: true
  eval_freq: 1000000
  num_games: 5000
  opponent: heuristic
  metric: avg_score
  mode: max
  min_delta: 0.01
  patience: 6
  min_timesteps: 6000000
  seed_offset: 100000
