# Smoke config: BC-only warm-start check for the v8 pipeline (no PPO steps).
seed: 2026
observation:
  include_table: true
  include_hand: true
  include_action_features: true
action_features:
  effective_tiles: false
env:
  controlled_player: 0
  max_steps_per_game: 300
  opponent_agent: heuristic
  allow_chow: true
reward:
  score_scale: 6.0
model:
  policy: MultiInputPolicy
  device: cpu
  activation_fn: gelu
  ortho_init: false
  feature_extractor:
    name: mahjong_attention
    static_hidden_dims: [256, 256]
    d_model: 64
    nhead: 4
    num_layers: 2
    features_dim: 256
    dropout: 0.05
    max_hand_tiles: 14
  net_arch:
    pi: [256, 128]
    vf: [256, 128]
train:
  total_timesteps: 0
  num_envs: 2
  vec_env_type: dummy
  learning_rate: 0.0001
  n_steps: 64
  batch_size: 64
logging:
  checkpoint_dir: artifacts/checkpoints/v8_bc_smoke
