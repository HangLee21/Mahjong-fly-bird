seed: 2026
env:
  controlled_player: 0
  max_steps_per_game: 120
  obs_include_action_mask: false
  opponent_agent: heuristic
  allow_chow: true
reward:
  score_scale: 10.0
  step_penalty: 0.001
model:
  policy: MlpPolicy
  device: cuda
  activation_fn: gelu
  net_arch:
    pi: [128, 128]
    vf: [128, 128]
train:
  total_timesteps: 256
  num_envs: 2
  vec_env_type: subproc
  learning_rate: 0.0003
  n_steps: 64
  batch_size: 64
  n_epochs: 1
  gamma: 0.99
logging:
  checkpoint_dir: artifacts/checkpoints/vec_smoke
  checkpoint_freq: 128
early_stop:
  enabled: false


